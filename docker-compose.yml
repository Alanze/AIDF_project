services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - MODEL_PROVIDER=${MODEL_PROVIDER:-mock}
      - MODEL_NAME=${MODEL_NAME:-qwen-plus}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - KNOWLEDGE_BASE_PATH=${KNOWLEDGE_BASE_PATH:-data/processed/chunks.json}
      - TOP_K=${TOP_K:-5}
      - RUN_LOG_DIR=${RUN_LOG_DIR:-run}
      - RUN_LOG_ENABLED=${RUN_LOG_ENABLED:-true}
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data:ro
      - ./run:/app/run

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

  ollama:
    image: ollama/ollama:latest
    profiles:
      - local-llm
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

volumes:
  ollama:
